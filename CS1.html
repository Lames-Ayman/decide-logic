<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق خوارزمية القرار (DecideLogic)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #f0f4f8;
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">خوارزمية القرار (DecideLogic)</h1>
            <p class="text-sm text-slate-500 mt-1">نظم مهامك بناءً على الأهمية والاستعجال باستخدام مصفوفة أيزنهاور </p>
        </div>

        <div id="login-section" class="mb-6 p-4 bg-slate-50 rounded-xl border border-slate-200">
            <label class="block text-sm font-medium text-slate-700 mb-2">أدخل اسمك لتبدأ صفحتك الخاصة:</label>
            <div class="flex gap-2">
                <input type="text" id="username-input" placeholder="مثال: لميس" class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="loginUser()" class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition">دخول</button>
            </div>
        </div>

        <div id="app-section" class="hidden">
            <div class="flex justify-between items-center mb-4 bg-blue-50 p-3 rounded-lg">
                <span class="text-sm font-semibold text-blue-900" id="welcome-msg"></span>
                <button onclick="logoutUser()" class="text-xs text-red-600 hover:underline">تغيير الاسم</button>
            </div>

            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                <h2 class="text-md font-semibold text-slate-700 mb-3">مهمة جديدة</h2>
                
                <div class="mb-3">
                    <label class="block text-xs text-slate-600 mb-1">أدخل المهمة:</label>
                    <input type="text" id="task-title" placeholder="مثال: التحضير للمشاركة في ملتقى تخصصي وجودة الحياة" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">هل المهمة مهمة؟</label>
                        <select id="task-important" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                            <option value="yes">نعم</option>
                            <option value="no">لا</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">هل المهمة عاجلة؟</label>
                        <select id="task-urgent" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                            <option value="yes">نعم</option>
                            <option value="no">لا</option>
                        </select>
                    </div>
                </div>

                <button onclick="addTask()" class="w-full bg-slate-800 text-white py-2 rounded-lg text-sm hover:bg-slate-900 transition">+ أضف المهمة</button>
            </div>

            <h2 class="text-md font-semibold text-slate-700 mb-3">مصفوفة القرار</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div class="bg-rose-50 border border-rose-200 p-4 rounded-xl">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-rose-700 text-sm">🔥 افعلها الآن (مهم وعاجل)</span>
                        <span id="count-1" class="bg-rose-200 text-rose-800 text-xs px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <ul id="list-1" class="space-y-2 text-sm"></ul>
                </div>
                <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-blue-700 text-sm">📅 خطط لها (مهم وغير عاجل)</span>
                        <span id="count-2" class="bg-blue-200 text-blue-800 text-xs px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <ul id="list-2" class="space-y-2 text-sm"></ul>
                </div>

                <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-amber-700 text-sm">🤝 فوضها (عاجل وغير مهم)</span>
                        <span id="count-3" class="bg-amber-200 text-amber-800 text-xs px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <ul id="list-3" class="space-y-2 text-sm"></ul>
                </div>

                <div class="bg-slate-100 border border-slate-200 p-4 rounded-xl">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-slate-600 text-sm">🗑️ ألغها (غير مهم وغير عاجل)</span>
                        <span id="count-4" class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <ul id="list-4" class="space-y-2 text-sm"></ul>
                </div>

            </div>
        </div>

    </div>

    <script>
        let currentUser = localStorage.getItem('decide_logic_user') || '';

        if (currentUser) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText =` أهلاً بك، ${currentUser} (صفحتك الخاصة)`;
            loadTasks();
        }

        function loginUser() {
            const name = document.getElementById('username-input').value.trim();
            if (!name) {
                alert('الرجاء إدخال الاسم للمتابعة');
                return;
            }
            currentUser = name;
            localStorage.setItem('decide_logic_user', currentUser);
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText =` أهلاً بك، ${currentUser} (صفحتك الخاصة)`;
            loadTasks();
        }

        function logoutUser() {
            localStorage.removeItem('decide_logic_user');
            location.reload();
        }

        function getStorageKey() {
            return `tasks_ ${currentUser}`;
        }

        function addTask() {
            const title = document.getElementById('task-title').value.trim();
            const important = document.getElementById('task-important').value;
            const urgent = document.getElementById('task-urgent').value;

            if (!title) {
                alert('الرجاء كتابة تفاصيل المهمة');
                return;
            }

            let category = 1;
            if (important === 'yes' && urgent === 'yes') category = 1;
            else if (important === 'yes' && urgent === 'no') category = 2;
            else if (important === 'no' && urgent === 'yes') category = 3;
            else category = 4;

            const tasks = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            tasks.push({ id: Date.now(), title, category, completed: false });
            localStorage.setItem(getStorageKey(), JSON.stringify(tasks));

            document.getElementById('task-title').value = '';
            loadTasks();
        }
        function toggleTask(id) {
            const tasks = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            const updated = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            localStorage.setItem(getStorageKey(), JSON.stringify(updated));
            loadTasks();
        }

        function deleteTask(id) {
            let tasks = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem(getStorageKey(), JSON.stringify(tasks));
            loadTasks();
        }

        function loadTasks() {
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`list-${i}`).innerHTML = '';
                document.getElementById(`count-${i}`).innerText = '0';
            }

            const tasks = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            const counts = {1:0, 2:0, 3:0, 4:0};

            tasks.forEach(task => {
                counts[task.category]++;
                const list = document.getElementById(`list-${task.category}`);
                const li = document.createElement('li');
                li.className = `flex justify-between items-center bg-white p-2 rounded border shadow-sm ${task.completed ? 'opacity-50 line-through' : ''}`;
                li.innerHTML =` 
                    <div class="flex items-center gap-2">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${task.id})" class="w-4 h-4 text-blue-600 rounded">
                        <span class="text-slate-700 text-sm">${task.title}</span>
                    </div>
                    <button onclick="deleteTask(${task.id})" class="text-xs text-red-500 hover:text-red-700">حذف</button>
                `;
                list.appendChild(li);
            });

            for (let i = 1; i <= 4; i++) {
                document.getElementById(`count-${i}`).innerText = counts[i];
            }
        }
    </script>
</body>
</html>
